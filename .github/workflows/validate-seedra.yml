name: Validate Xbox One Legacy Generator

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate-seedra.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Clone Seedra
        run: |
          git clone --recursive https://github.com/UtterEvergreen1/Seedra.git Seedra

      - name: Create Xbox One validation program
        run: |
          cat > Seedra/xbox_validation.cpp <<'CPP'
          #include <iostream>
          #include <vector>
          #include <string>
          #include <cmath>

          #include "terrain/generator.hpp"
          #include "structures/placement/StaticStructures.hpp"
          #include "structures/placement/DynamicStructures.hpp"

          static int distance2D(const Pos2D& a, int x, int z) {
              const long long dx = static_cast<long long>(a.x) - x;
              const long long dz = static_cast<long long>(a.z) - z;
              return static_cast<int>(std::sqrt(static_cast<double>(dx * dx + dz * dz)));
          }

          static void printNearest(
              const std::string& label,
              const std::vector<Pos2D>& positions,
              int targetX,
              int targetZ
          ) {
              if (positions.empty()) {
                  std::cout << label << ": NONE FOUND\n";
                  return;
              }

              const Pos2D* best = &positions.front();
              int bestDistance = distance2D(*best, targetX, targetZ);

              for (const auto& p : positions) {
                  const int d = distance2D(p, targetX, targetZ);
                  if (d < bestDistance) {
                      bestDistance = d;
                      best = &p;
                  }
              }

              std::cout
                  << label
                  << " expected=(" << targetX << "," << targetZ << ")"
                  << " nearest=(" << best->x << "," << best->z << ")"
                  << " distance=" << bestDistance
                  << "\n";
          }

          int main() {
              constexpr long long seed = -8159138563860309866LL;

              Generator generator(
                  lce::CONSOLE::XBOX1,
                  LCEVERSION::ELYTRA,
                  seed,
                  lce::WORLDSIZE::LARGE,
                  lce::BIOMESCALE::LARGE
              );

              std::cout << "========================================\n";
              std::cout << "Xbox One Legacy Seedra validation\n";
              std::cout << "========================================\n";
              std::cout << "Seed: " << seed << "\n";
              std::cout << "Console: XBOX1\n";
              std::cout << "Version: ELYTRA / 1.12 family\n";
              std::cout << "World size: LARGE\n";
              std::cout << "Biome scale: LARGE\n\n";

              const Pos2D spawn = generator.getSpawnBlock();

              std::cout << "SPAWN\n";
              std::cout << "Expected: (164,205)\n";
              std::cout << "Seedra:   (" << spawn.x << "," << spawn.z << ")\n";
              std::cout << "Distance: " << distance2D(spawn, 164, 205) << "\n\n";

              const auto villages =
                  Placement::Village<false>::getAllPositions(&generator);

              const auto mansions =
                  Placement::Mansion::getAllPositions(&generator);

              std::vector<Pos2D> jungleTemples;
              std::vector<Pos2D> witchHuts;
              std::vector<Pos2D> desertTemples;
              std::vector<Pos2D> igloos;

              const auto features =
                  Placement::Feature::getAllFeaturePositions(&generator);

              for (const auto& feature : features) {
                  switch (feature.m_type) {
                      case StructureType::JungleTemple:
                          jungleTemples.push_back(feature.m_pos);
                          break;

                      case StructureType::SwampHut:
                          witchHuts.push_back(feature.m_pos);
                          break;

                      case StructureType::DesertPyramid:
                          desertTemples.push_back(feature.m_pos);
                          break;

                      case StructureType::Igloo:
                          igloos.push_back(feature.m_pos);
                          break;

                      default:
                          break;
                  }
              }

              std::cout << "KNOWN PUBLISHED LOCATIONS\n";

              printNearest(
                  "Oak village",
                  villages,
                  548,
                  367
              );

              printNearest(
                  "Spruce village",
                  villages,
                  -399,
                  -459
              );

              printNearest(
                  "Woodland mansion",
                  mansions,
                  426,
                  122
              );

              printNearest(
                  "Jungle temple",
                  jungleTemples,
                  70,
                  337
              );

              printNearest(
                  "Witch hut",
                  witchHuts,
                  276,
                  -191
              );

              std::cout << "\nCOUNTS\n";
              std::cout << "Villages: " << villages.size() << "\n";
              std::cout << "Mansions: " << mansions.size() << "\n";
              std::cout << "Jungle temples: " << jungleTemples.size() << "\n";
              std::cout << "Witch huts: " << witchHuts.size() << "\n";
              std::cout << "Desert temples: " << desertTemples.size() << "\n";
              std::cout << "Igloos: " << igloos.size() << "\n";

              std::cout << "\nALL VILLAGES\n";
              for (const auto& p : villages)
                  std::cout << p.x << "," << p.z << "\n";

              std::cout << "\nALL MANSIONS\n";
              for (const auto& p : mansions)
                  std::cout << p.x << "," << p.z << "\n";

              std::cout << "\nALL FEATURES\n";
              for (const auto& feature : features) {
                  std::cout
                      << getStructureName(feature.m_type)
                      << ": "
                      << feature.m_pos.x
                      << ","
                      << feature.m_pos.z
                      << "\n";
              }

              return 0;
          }
          CPP

      - name: Add validation target to Seedra
        run: |
          cat >> Seedra/CMakeLists.txt <<'CMAKE'

          add_executable(EXE_XboxOneValidation xbox_validation.cpp)
          target_link_libraries(EXE_XboxOneValidation PRIVATE LIB_Seedra)
          target_include_directories(EXE_XboxOneValidation PRIVATE
              ${CMAKE_CURRENT_SOURCE_DIR}
              ${CMAKE_CURRENT_SOURCE_DIR}/lce
          )
          target_compile_features(EXE_XboxOneValidation PRIVATE cxx_std_23)
          CMAKE

      - name: Configure Seedra
        run: |
          cmake \
            -S Seedra \
            -B Seedra/build \
            -G Ninja \
            -DLC_BUILD_EXECUTABLE=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile validation program
        run: |
          cmake --build Seedra/build --target EXE_XboxOneValidation

      - name: Run Xbox One validation
        run: |
          Seedra/build/EXE_XboxOneValidation | tee xbox-validation-results.txt

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: xbox-one-validation-results
          path: xbox-validation-results.txt
